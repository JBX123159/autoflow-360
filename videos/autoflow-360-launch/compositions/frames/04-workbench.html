    (() => {
      const compositionId = "04-workbench";
      const root = document.querySelector('[data-composition-id="04-workbench"]');
      const scene = root.querySelector('[class~="04-workbench-scene"]');
      const camera = document.getElementById("04-workbench-camera");
      const focusRail = document.getElementById("04-workbench-focus-rail");
      const device = document.getElementById("04-workbench-device");
      const approval = document.getElementById("04-workbench-approval");
      const expiry = document.getElementById("04-workbench-expiry");
      const risk = document.getElementById("04-workbench-risk");
      const ai = document.getElementById("04-workbench-ai");
      const riskGlow = document.getElementById("04-workbench-risk-glow");

      const sceneRect = scene.getBoundingClientRect();
      const sceneCenterX = sceneRect.left + sceneRect.width / 2;
      const sceneCenterY = sceneRect.top + sceneRect.height / 2;

      const targetPlan = (element, desiredScale) => {
        const rect = element.getBoundingClientRect();
        const offsetX = rect.left + rect.width / 2 - sceneCenterX;
        const offsetY = rect.top + rect.height / 2 - sceneCenterY;
        const maxScale = Math.min(
          (0.88 * sceneRect.width) / rect.width,
          (0.88 * sceneRect.height) / rect.height,
        );

        return {
          x: -offsetX,
          y: -offsetY,
          scale: Math.min(desiredScale, maxScale),
        };
      };

      const approvalPlan = targetPlan(approval, 1.22);
      const expiryPlan = targetPlan(expiry, 1.18);
      const riskPlan = targetPlan(risk, 1.18);
      const aiPlan = targetPlan(ai, 1.22);

      const phase = { scale: 0.96 };
      const drift = { p: 0 };
      const timeline = gsap.timeline({ paused: true });

      timeline.fromTo(
        device,
        { opacity: 0.64, y: 14 },
        { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" },
        0,
      );
      timeline.to(phase, { scale: 1, duration: 1.45, ease: "power2.out" }, 0.2);

      timeline.to(
        phase,
        { scale: approvalPlan.scale, duration: 1.35, ease: "power3.inOut" },
        2.044,
      );
      timeline.to(
        focusRail,
        { x: approvalPlan.x, y: approvalPlan.y, duration: 1.35, ease: "power3.inOut" },
        2.044,
      );
      timeline.fromTo(
        approval,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.56, ease: "power2.out" },
        2.42,
      );

      timeline.to(
        phase,
        { scale: expiryPlan.scale, duration: 1.15, ease: "power2.inOut" },
        5.111,
      );
      timeline.to(
        focusRail,
        { x: expiryPlan.x, y: expiryPlan.y, duration: 1.15, ease: "power2.inOut" },
        5.111,
      );
      timeline.to(approval, { opacity: 0.24, duration: 0.46, ease: "power2.out" }, 5.111);
      timeline.fromTo(
        expiry,
        { opacity: 0, scale: 0.97 },
        { opacity: 1, scale: 1, duration: 0.58, ease: "power2.out" },
        5.48,
      );

      timeline.to(
        phase,
        { scale: riskPlan.scale, duration: 1.08, ease: "power2.inOut" },
        7.667,
      );
      timeline.to(
        focusRail,
        { x: riskPlan.x, y: riskPlan.y, duration: 1.08, ease: "power2.inOut" },
        7.667,
      );
      timeline.to(expiry, { opacity: 0.24, duration: 0.44, ease: "power2.out" }, 7.667);
      timeline.fromTo(
        riskGlow,
        { opacity: 0, scale: 0.82 },
        { opacity: 0.3, scale: 1, duration: 0.86, ease: "power2.out" },
        7.82,
      );
      timeline.fromTo(
        risk,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.62, ease: "power2.out" },
        8.02,
      );
      timeline.to(risk, { scale: 1.025, duration: 0.28, ease: "power2.out" }, 8.72);
      timeline.to(risk, { scale: 1, duration: 0.46, ease: "power2.out" }, 9.0);

      timeline.to(

        10.222,
      );
      timeline.to(
        focusRail,
        { x: aiPlan.x, y: aiPlan.y, duration: 1.05, ease: "power3.inOut" },

      timeline.to(risk, { opacity: 0.24, duration: 0.42, ease: "power2.out" }, 10.222);
      timeline.to(riskGlow, { opacity: 0.12, duration: 0.42, ease: "power2.out" }, 10.222);
      timeline.fromTo(
        ai,

        { opacity: 1, scale: 1, duration: 0.62, ease: "power2.out" },
        10.6,
      );

      timeline.to(
        drift,
        {
          p: Math.PI * 2 * 1.25,
          duration: 12.267,
          ease: "none",
          onUpdate: () => {
            const driftX = Math.sin(drift.p) * 3;
            const driftY = Math.sin(drift.p * 1.31) * 2;
            camera.style.transform = `scale(${phase.scale}) translate(${driftX}px, ${driftY}px)`;
          },
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-workbench"] = timeline;
    })();
