      series.setAttribute("points", riskPoints.map((point) => `${point.x},${point.y}`).join(" "));

      const riskDriver = { progress: 0 };
      let lastRiskIndex = -1;
      const applyRiskReadout = () => {
        const fractionalIndex = riskDriver.progress * (riskPoints.length - 1);
        const leftIndex = Math.min(riskPoints.length - 2, Math.floor(fractionalIndex));
        const localProgress = fractionalIndex - leftIndex;
        const leftPoint = riskPoints[leftIndex];
        const rightPoint = riskPoints[leftIndex + 1];
        const x = leftPoint.x + (rightPoint.x - leftPoint.x) * localProgress;
        const y = leftPoint.y + (rightPoint.y - leftPoint.y) * localProgress;

        trackLine.setAttribute("x1", String(x));
        trackLine.setAttribute("x2", String(x));
        marker.setAttribute("cx", String(x));
        marker.setAttribute("cy", String(y));

        const tooltipX = Math.min(194, Math.max(8, x + 20));
        const tooltipY = Math.min(106, Math.max(6, y - 38));
        tooltip.style.transform = `translate(${tooltipX}px, ${tooltipY}px)`;

        const nearestIndex = Math.round(fractionalIndex);
        if (nearestIndex !== lastRiskIndex) {
          tooltip.textContent = riskPoints[nearestIndex].label;
          lastRiskIndex = nearestIndex;
        }
      };
      applyRiskReadout();

      const sceneRect = scene.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetOffsetX = targetRect.left + targetRect.width / 2 - (sceneRect.left + sceneRect.width / 2);
