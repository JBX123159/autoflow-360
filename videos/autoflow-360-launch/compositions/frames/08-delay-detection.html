        tl.to(
          tracking,
          {
            p: Math.PI * 2 * 1.15,
            duration: 5.307,
            ease: "none",
            onUpdate: () => {
              const placeBox = (box, anchor, phaseOffset, label, prefix) => {
                const targetX = anchor.x + Math.cos(tracking.p + phaseOffset) * 4;
                const targetY = anchor.y + Math.sin(tracking.p * 1.31 + phaseOffset) * 3;
                const boxWidth = 332 + Math.sin(tracking.p * 1.7 + phaseOffset) * 10;
                const boxHeight = 112 + Math.sin(tracking.p * 1.7 + phaseOffset + Math.PI / 2) * 5;
                box.style.width = `${boxWidth}px`;
                box.style.height = `${boxHeight}px`;
                box.style.left = `${targetX - boxWidth / 2}px`;
                box.style.top = `${targetY - boxHeight / 2}px`;
                const confidence = Math.round(97 + Math.sin(tracking.p * 3.6 + phaseOffset));
                label.textContent = `${prefix} · ${confidence}%`;
              };
              placeBox(trackA, pointA, 0, trackLabelA, "SCAN A");
              placeBox(trackB, pointB, Math.PI / 2, trackLabelB, "SCAN B");
            },
          },
          4.477,
        );

        tl.to(drift, { amp: 0, duration: 0.7, ease: "power2.out" }, 10.72);
        tl.to(
          drift,
          {
            p: Math.PI * 2 * 1.35,
            duration: 12.437,
            ease: "none",
            onUpdate: () => {
              const dx = Math.sin(drift.p) * 3.5 * drift.amp;
              const dy = Math.sin(drift.p * 1.31) * 2.2 * drift.amp;
              outer.style.transform = `scale(${phase.scale})`;
              inner.style.transform = `translate(${pan.x + dx}px, ${pan.y + dy}px)`;
            },
          },
          0,
        );
      })();
    </script>
  </div>
</template>
