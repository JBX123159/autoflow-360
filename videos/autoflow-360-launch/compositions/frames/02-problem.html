  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (() => {
      const frameRoot = document.querySelector('[data-composition-id="02-problem"]');
      const cloudStage = document.getElementById('02-problem-cloud-stage');
      const carriers = Array.from(frameRoot.querySelectorAll('[data-part="carrier"]'));
      const questions = Array.from(frameRoot.querySelectorAll('[data-part="question"]'));
      const duration = 12.032;

      const GOLDEN = Math.PI * (3 - Math.sqrt(5));
      const RADIUS_X = 260;
      const RADIUS_Y = 100;
      const Z_NEAR = 280;
      const Z_FAR = -340;
      const TUMBLE = 68;

      const scatter = carriers.map((carrier, index) => {
        const angle = index * GOLDEN;
        const depthRatio = carriers.length > 1 ? index / (carriers.length - 1) : 0;
        const targetX = Number(carrier.dataset.targetX);
        const targetY = Number(carrier.dataset.targetY);
        const horizontalDirection = Math.sign(targetX);
        const verticalDirection = Math.sign(targetY);
        return {
          x: targetX + horizontalDirection * (RADIUS_X + Math.abs(Math.cos(angle)) * 80),
          y: targetY + verticalDirection * (RADIUS_Y + Math.abs(Math.sin(angle)) * 40),
          z: Z_NEAR - depthRatio * (Z_NEAR - Z_FAR),
          rotationX: Math.sin(angle) * TUMBLE,
          rotationY: Math.cos(angle) * TUMBLE
        };
      });

      carriers.forEach((carrier, index) => {
        gsap.set(carrier, {
          xPercent: -50,
          yPercent: -50,
          ...scatter[index],
          opacity: 0
        });
      });

      questions.forEach((question) => {
        gsap.set(question, { opacity: 0, y: 28, scale: 0.96 });
      });

      gsap.set(cloudStage, { rotationY: -8, transformPerspective: 1400 });

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-problem"] = tl;

      tl.to(cloudStage, {
        rotationY: 5,
        duration: 6.55,
        ease: "power1.out"
      }, 0);

      const arrivals = [0.08, 2.406, 4.922, 5.34];
      carriers.forEach((carrier, index) => {
        tl.to(carrier, {
          x: Number(carrier.dataset.targetX),
          y: Number(carrier.dataset.targetY),
          z: 0,
          rotationX: 0,
          rotationY: 0,
          opacity: 1,
          duration: index < 2 ? 1.18 : 1.08,
          ease: "power3.out"
        }, arrivals[index]);
      });

      tl.to(cloudStage, {
        rotationY: 0,
        duration: 0.56,
        ease: "power2.out"
      }, 6.55);

      tl.to(carriers, {
        opacity: 0.46,
        duration: 0.58,
        ease: "power2.out"
      }, 6.53);

      tl.to(carriers, {
        x: (index, carrier) => Number(carrier.dataset.targetX) * 0.92,
        y: (index, carrier) => Number(carrier.dataset.targetY) * 0.92,
        duration: 2.88,
        ease: "power1.out"
      }, 7.11);

      const QUESTION_CONTENT = [
        { title: "卡在哪", hold: 0.25 },
        { title: "谁负责", hold: 0.30 },
        { title: "下一步", hold: 1.00 }
      ];
      const BASE_DURATION = 0.62;
      const SEC_PER_CHAR = 0.05;
      let cumulative = 0;
      const QUESTION_TIMELINE = QUESTION_CONTENT.map((entry) => {
        const itemDuration = BASE_DURATION + entry.title.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += itemDuration;
        return { ...entry, start, end: cumulative };
      });
      const sequenceStart = 7.11;
      const sequenceWindow = 3.172;

      QUESTION_TIMELINE.forEach((entry, index) => {
        const arrival = sequenceStart + (entry.start / cumulative) * sequenceWindow;
        tl.fromTo(questions[index], {
          opacity: 0,
          y: 28,
          scale: 0.96
        }, {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.68,
          ease: "power3.out"
        }, arrival);
      });

      const holdDriver = { progress: 0 };
      tl.to(holdDriver, {
        progress: 1,
        duration: duration - 10.282,
        ease: "none"
      }, 10.282);
    })();
  </script>
