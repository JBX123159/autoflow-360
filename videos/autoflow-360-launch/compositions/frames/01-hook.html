  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-hook"]');
      const timeline = gsap.timeline({ paused: true });
      const duration = 10.283;
      const pulse = 0.914;
      const beats = [0.18, 1.828, 2.742, 3.656, 4.570, 5.484, 6.398, 8.569];

      const byId = (id) => document.getElementById(id);
      const allByClass = (className) => root.getElementsByClassName(className);
      const route = byId('01-hook-route-live');
      const routeLength = route.getTotalLength();
      route.style.strokeDasharray = String(routeLength);
      route.style.strokeDashoffset = String(routeLength);

      [byId('01-hook-break-left'), byId('01-hook-break-right')].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      timeline.fromTo(
        byId('01-hook-hero'),
        { y: -82, scale: 1.16, filter: 'blur(13px)', opacity: 0 },
        { y: 0, scale: 1, filter: 'blur(0px)', opacity: 1, duration: 0.52, ease: 'power4.out' },
        beats[0]
      );
      timeline.fromTo(
        byId('01-hook-kicker'),
        { x: -80, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.44, ease: 'expo.out' },
        beats[0] + 0.10
      );
      timeline.fromTo(
        byId('01-hook-start-dot'),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.46, ease: 'back.out(2)' },
        beats[0] + 0.20
      );
      timeline.to(
        route,
        { strokeDashoffset: routeLength * 0.90, duration: 0.72, ease: 'power2.out' },
        beats[0] + 0.24
      );

      const sequenceStates = [
        { t: 0, text: '' },
        { t: beats[1], text: '报价' },
        { t: beats[2], text: '样品' },
        { t: beats[3], text: '采购' },
        { t: beats[4], text: '交付' },
        { t: beats[5], text: '回款' },
        { t: beats[6], text: '已连通 ✓' },
        { t: beats[7], text: '断点' }
      ];
      const textElement = byId('01-hook-sequence-text');
      const cursorElement = byId('01-hook-cursor');
      const sequenceDriver = { time: 0 };
      timeline.to(sequenceDriver, {
        time: duration,
        duration,
        ease: 'none',
        onUpdate: () => {
          let value = '';
          for (let index = sequenceStates.length - 1; index >= 0; index -= 1) {
            if (sequenceDriver.time >= sequenceStates[index].t) {
              value = sequenceStates[index].text;
              break;
            }
          }
          textElement.textContent = value;
        }
      }, 0);

      const blinkDriver = { phase: 0 };
      timeline.to(blinkDriver, {
        phase: Math.PI * 2 * 16,
        duration,
        ease: 'none',
        onUpdate: () => {
          cursorElement.style.opacity = Math.sin(blinkDriver.phase) > 0 ? '1' : '0';
        }
      }, 0);

      const nodes = [
        { id: '01-hook-node-quote', beat: beats[1], route: 0.79, from: { scale: 1.52, filter: 'blur(12px)', opacity: 0 }, ease: 'power4.out' },
        { id: '01-hook-node-sample', beat: beats[2], route: 0.61, from: { x: -145, opacity: 0 }, ease: 'expo.out' },
        { id: '01-hook-node-buy', beat: beats[3], route: 0.43, from: { y: 72, rotation: 5, opacity: 0 }, ease: 'circ.out' },
        { id: '01-hook-node-deliver', beat: beats[4], route: 0.25, from: { scale: 1.42, filter: 'blur(10px)', opacity: 0 }, ease: 'power4.out' },
        { id: '01-hook-node-cash', beat: beats[5], route: 0, from: { x: 145, opacity: 0 }, ease: 'expo.out' }
      ];

      nodes.forEach((node) => {
        const element = byId(node.id);
        timeline.fromTo(
          element,
          node.from,
          { x: 0, y: 0, rotation: 0, scale: 1, filter: 'blur(0px)', opacity: 1, duration: 0.48, ease: node.ease },
          node.beat
        );
        timeline.to(
          route,
          { strokeDashoffset: routeLength * node.route, duration: 0.70, ease: 'power2.out' },
          node.beat - 0.12
        );
        timeline.to(
          element.querySelector('[class~="01-hook-node-dot"]'),
          { backgroundColor: '#2563b8', outlineColor: 'rgba(37, 99, 184, 0.45)', duration: 0.18, ease: 'none' },
          node.beat + 0.12
        );
        timeline.to(
          element.querySelector('[class~="01-hook-node-label"]'),
          { color: '#20242b', backgroundColor: 'rgba(37, 99, 184, 0.10)', duration: 0.18, ease: 'none' },
          node.beat + 0.12
        );
      });

      allByClass('01-hook-beat-rail')[0].querySelectorAll('i').forEach((tick, index) => {
        timeline.fromTo(
          tick,
          { opacity: 0.16, scaleY: 1 },
          { opacity: 1, scaleY: 1.9, duration: 0.16, ease: 'power2.out' },
          beats[index + 1]
        );
        timeline.to(
          tick,
          { opacity: 0.42, scaleY: 1, duration: 0.20, ease: 'power1.out' },
          beats[index + 1] + 0.16
        );
      });

      timeline.fromTo(
        byId('01-hook-chain'),
        { x: 0, scale: 1 },
        { x: -74, scale: 1.10, duration: 2.02, ease: 'power1.inOut' },
        beats[6]
      );
      timeline.fromTo(
        byId('01-hook-sequence-text'),
        { color: '#2563b8' },
        { color: '#20242b', duration: 0.36, ease: 'power1.out' },
        beats[6] + 0.38
      );

      timeline.fromTo(
        byId('01-hook-break-mask'),
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.20, ease: 'power4.out' },
        beats[7]
      );
      timeline.to(
        byId('01-hook-break-left'),
        { strokeDashoffset: 0, duration: 0.30, ease: 'power2.out' },
        beats[7] + 0.05
      );
      timeline.to(
        byId('01-hook-break-right'),
        { strokeDashoffset: 0, duration: 0.30, ease: 'power2.out' },
        beats[7] + 0.27
      );
      timeline.fromTo(
        byId('01-hook-break-label'),
        { y: -74, scale: 1.38, filter: 'blur(14px)', opacity: 0 },
        { y: 0, scale: 1, filter: 'blur(0px)', opacity: 1, duration: 0.50, ease: 'power4.out' },
        beats[7] + 0.10
      );
      timeline.fromTo(
        byId('01-hook-stage'),
        { x: 0 },
        { x: -18, duration: 0.16, ease: 'power4.out' },
        beats[7]
      );
      timeline.to(
        byId('01-hook-stage'),
        { x: 0, duration: 0.34, ease: 'power2.out' },
        beats[7] + 0.16
      );

      timeline.to({}, { duration: pulse * 0.1 }, duration - pulse * 0.1);
      window.__timelines = window.__timelines || {};
      window.__timelines['01-hook'] = timeline;
    })();
