      const drawPaths = Array.from(frameRoot.querySelectorAll('[data-f03="draw-path"]'));
      const originRing = frameRoot.querySelector('[data-path-role="origin"]');
      const auditRing = frameRoot.querySelector('[data-path-role="audit"]');

      const wordmark = frameRoot.querySelector('[data-f03="wordmark"]');
      const auditLabel = frameRoot.querySelector('[data-f03="audit-label"]');
      const origin = frameRoot.querySelector('[data-f03="origin"]');

      drawPaths.forEach((path) => {
        const measuredLength = path.getTotalLength();
        path.style.strokeDasharray = String(measuredLength);
        path.style.strokeDashoffset = String(measuredLength);
      });

      connectors.forEach((path) => {
        path.style.strokeWidth = "3";
        path.style.opacity = "0.30";
      });
      originRing.style.strokeWidth = "5";
      originRing.style.opacity = "0.34";
      auditRing.style.strokeWidth = "4";
      auditRing.style.opacity = "0.82";

      gsap.set(stations, { xPercent: -50, yPercent: -50, opacity: 0, scale: 0.62 });
      gsap.set(connectors, { opacity: 0.30 });
      gsap.set(auditRing, { opacity: 0 });
      gsap.set(logoPieces, { opacity: 0 });
      gsap.set(logoFinal, { opacity: 0, scale: 0.92 });
      gsap.set(wordmark, { opacity: 0, y: 18 });
      gsap.set(auditLabel, { opacity: 0, y: 14 });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(origin,
        { opacity: 0, scale: 0.35 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" },
        0.08
      );
      tl.to(originRing,
        { strokeDashoffset: 0, duration: 1.48, ease: "power2.out" },
        0.18
      );

      const stationStarts = [1.94, 2.42, 3.08, 3.72, 4.42, 5.18, 5.84];
      stations.forEach((station, index) => {
        const targetX = Number(station.dataset.targetX);
        const targetY = Number(station.dataset.targetY);
        tl.fromTo(station,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * 0.20,
            y: targetY * 0.20,
            scale: 0.62,
            opacity: 0
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            opacity: 1,
            duration: 1.12,
            ease: "power3.out"
          },
          stationStarts[index]
        );

        tl.to(connectors[index],
          { strokeDashoffset: 0, duration: 0.90, ease: "power2.out" },
          stationStarts[index] + 0.34
        );
      });

      tl.to(stations,
        {
          x: (index, element) => Number(element.dataset.targetX) * 0.68,
          y: (index, element) => Number(element.dataset.targetY) * 0.68,
          scale: 0.78,
          opacity: 0.56,
          duration: 1.14,
          stagger: 0.035,
          ease: "power3.out"
        },
        7.224

      tl.to(connectors,
        { opacity: 0.12, duration: 0.82, stagger: 0.025, ease: "power1.out" },
        7.30
      );
      tl.to(auditRing,
        { opacity: 0.82, strokeDashoffset: 0, duration: 1.10, ease: "power2.out" },
        7.30
      );

      tl.fromTo(logoPieces[0],
        { x: 0, y: -112, opacity: 0, scale: 0.84 },
        { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.72, ease: "power3.out" },
        7.48
      );
      tl.fromTo(logoPieces[1],
        { x: -126, y: 0, opacity: 0, scale: 0.84 },
        { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.72, ease: "power3.out" },
        7.72
      );
      tl.fromTo(logoPieces[2],
        { x: 112, y: 92, opacity: 0, scale: 0.84 },
        { x: 0, y: 0, opacity: 1, scale: 1, duration: 0.72, ease: "power3.out" },

        { opacity: 1, scale: 1, duration: 0.46, ease: "power1.out" },

        { opacity: 0.34, duration: 0.44, stagger: 0.02, ease: "power1.out" },
