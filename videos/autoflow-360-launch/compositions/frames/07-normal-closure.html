  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="07-normal-closure"]');
      if (!root || typeof gsap === "undefined") return;

      const scene = root.querySelector('[data-part="07-normal-closure-scene"]');
      const camera = root.querySelector('[id="07-normal-closure-camera"]');
      const surface = root.querySelector('[id="07-normal-closure-surface"]');
      const deliveryTarget = root.querySelector('[id="07-normal-closure-delivery-target"]');
      const invoiceTarget = root.querySelector('[id="07-normal-closure-invoice-target"]');
      const paymentTarget = root.querySelector('[id="07-normal-closure-payment-target"]');
      const summaryTarget = root.querySelector('[id="07-normal-closure-summary-target"]');
      const auditTarget = root.querySelector('[id="07-normal-closure-audit-target"]');
      const sequenceLabel = root.querySelector('[id="07-normal-closure-sequence-label"]');
      const proofFill = root.querySelector('[id="07-normal-closure-proof-fill"]');

      if (
        !scene ||
        !camera ||
        !surface ||
        !deliveryTarget ||
        !invoiceTarget ||
        !paymentTarget ||
        !summaryTarget ||
        !auditTarget ||
        !sequenceLabel ||
        !proofFill
      ) return;

      const measureCounter = (target) => {
        const sceneRect = scene.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();
        const scaleX = sceneRect.width / 1920 || 1;
        const scaleY = sceneRect.height / 896 || 1;
        const offsetX = targetRect.left + targetRect.width / 2 - (sceneRect.left + sceneRect.width / 2);
        const offsetY = targetRect.top + targetRect.height / 2 - (sceneRect.top + sceneRect.height / 2);
        return { x: -offsetX / scaleX, y: -offsetY / scaleY };
      };

      const invoiceCounter = measureCounter(invoiceTarget);
      const paymentCounter = measureCounter(paymentTarget);
      const summaryCounter = measureCounter(summaryTarget);
      const auditCounter = measureCounter(auditTarget);

      const content = [
        { label: "真实交付", body: "收货", hold: 0.22 },
        { label: "发票回款", body: "付款", hold: 0.22 },
        { label: "审计留痕", body: "记录", hold: 0.22 },
      ];
      const baseDuration = 0.28;
      const secondsPerCharacter = 0.04;
      let cumulative = 0;
      const contentTimeline = content.map((entry) => {
        const duration = baseDuration + entry.body.length * secondsPerCharacter + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const entryAt = (time) => {
        for (let index = contentTimeline.length - 1; index >= 0; index -= 1) {
          if (time >= contentTimeline[index].start) return contentTimeline[index];
        }
        return contentTimeline[0];
      };

      const timeline = gsap.timeline({ paused: true });
      const phase = { scale: 0.99 };
      const drift = { progress: 0 };

      timeline.to(
        drift,
        {
          progress: Math.PI * 2 * 1.4,
          duration: 10.325,
          ease: "none",
          onUpdate: () => {
            const driftX = Math.sin(drift.progress) * 3;
            const driftY = Math.sin(drift.progress * 1.31) * 2;
            camera.style.transform = `scale(${phase.scale}) translate(${driftX}px, ${driftY}px)`;
          },
        },
        0,
      );

      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-title"]'),
        { opacity: 0, x: -32 },
        { opacity: 1, x: 0, duration: 0.48, ease: "power2.out" },
        0.08,
      );
      timeline.fromTo(
        deliveryTarget,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        0.28,
      );

      timeline.to(phase, { scale: 1.18, duration: 1.3, ease: "power3.inOut" }, 2.151);
      timeline.fromTo(
        surface,
        { x: 0, y: 0 },
        { x: invoiceCounter.x, y: invoiceCounter.y, duration: 1.3, ease: "power3.inOut" },
        2.151,
      );
      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-route-1"]'),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" },
        2.55,
      );
      timeline.fromTo(
        invoiceTarget,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.52, ease: "power2.out" },
        3.38,
      );

      timeline.to(phase, { scale: 1.22, duration: 1.24, ease: "power3.inOut" }, 4.56);
      timeline.to(
        surface,
        { x: paymentCounter.x, y: paymentCounter.y, duration: 1.24, ease: "power3.inOut" },
        4.56,
      );
      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-route-2"]'),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.82, ease: "power2.out" },
        4.92,
      );
      timeline.fromTo(
        paymentTarget,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
        5.62,
      );

      timeline.to(phase, { scale: 1.25, duration: 1.18, ease: "power3.inOut" }, 6.883);
      timeline.to(
        surface,
        { x: summaryCounter.x, y: summaryCounter.y, duration: 1.18, ease: "power3.inOut" },
        6.883,
      );
      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-route-3"]'),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.82, ease: "power2.out" },
        6.94,
      );
      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-summary-panel"]'),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power2.out" },
        7.12,
      );
      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-zero"]'),
        { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.82, ease: "power3.out" },
        7.52,
      );
      timeline.fromTo(
        [
          root.querySelector('[id="07-normal-closure-mini-paid"]'),
          root.querySelector('[id="07-normal-closure-mini-submitted"]'),
        ],
        { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.5, stagger: 0.16, ease: "power2.out" },
        7.82,
      );

      const sequenceDriver = { time: 0 };
      let lastLabel = "";
      timeline.to(
        sequenceDriver,
        {
          time: cumulative,
          duration: cumulative,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(sequenceDriver.time);
            if (entry.label !== lastLabel) {
              sequenceLabel.textContent = entry.label;
              lastLabel = entry.label;
            }
            proofFill.style.width = `${Math.min(100, (sequenceDriver.time / cumulative) * 100)}%`;
          },
        },
        6.94,
      );

      timeline.to(phase, { scale: 1.32, duration: 0.92, ease: "power3.inOut" }, 9.034);
      timeline.to(
        surface,
        { x: auditCounter.x, y: auditCounter.y, duration: 0.92, ease: "power3.inOut" },
        9.034,
      );
      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-route-4"]'),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.54, ease: "power2.out" },
        9.08,
      );
      timeline.fromTo(
        [
          root.querySelector('[id="07-normal-closure-converge-1"]'),
          root.querySelector('[id="07-normal-closure-converge-2"]'),
          root.querySelector('[id="07-normal-closure-converge-3"]'),
          root.querySelector('[id="07-normal-closure-converge-4"]'),
        ],
        { strokeDashoffset: 1, opacity: 0 },
        {
          strokeDashoffset: 0,
          opacity: 0.68,
          duration: 0.52,
          stagger: 0.06,
          ease: "power2.out",
        },
        9.24,
      );
      timeline.fromTo(
        auditTarget,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" },
        9.38,
      );
      timeline.fromTo(
        root.querySelector('[id="07-normal-closure-stamp"]'),
        { opacity: 0, scale: 1.28 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        9.64,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["07-normal-closure"] = timeline;
    })();
  </script>
